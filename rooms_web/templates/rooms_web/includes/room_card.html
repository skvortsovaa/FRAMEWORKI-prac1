<article class="card room-card h-100 shadow-sm">
    <div class="card-body p-4">
        <p class="small text-secondary">Помещение №{{ room.id }}</p>
        <h2 class="h4 card-title"><a href="{% if room.slug %}{{ room.get_absolute_url }}{% else %}{% url 'rooms:detail' room.id %}{% endif %}">{{ room.name|default:"Без названия" }}</a></h2>
        <p>Этаж: {{ room.floor }} · Площадь: {{ room.area|floatformat:"-2" }} м²</p>
        <a href="{% if room.slug %}{{ room.get_absolute_url }}{% else %}{% url 'rooms:detail' room.id %}{% endif %}" class="btn btn-outline-primary">Подробнее</a>
    </div>
</article>
