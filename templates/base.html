{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SmartSpace Monitor{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">
    {% include "includes/navigation.html" %}
    <main id="main-content" class="container py-5 flex-grow-1">
        {% block content %}{% endblock %}
    </main>
    <footer class="container py-3 border-top text-secondary small">
        © <span id="current-year">{% now "Y" %}</span> SmartSpace Monitor · Учебный проект
    </footer>
    <script src="{% static 'homepage/js/main.js' %}" defer></script>
</body>
</html>
